name: Chromatic

# Visual regression + UI review for Storybook.
# Soft gate initially (exitZeroOnChanges: true) — visual changes show up
# in the Chromatic UI for review but don't fail the PR. Flip to false
# once the team is comfortable approving changes there.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          # TurboSnap needs the full history to compare story dependencies
          # across commits. Without fetch-depth: 0 it falls back to full
          # snapshot every time.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # Dedicated build script that runs ONLY `storybook build` (no
          # registry post-step). The default `build-storybook` script
          # chains `build-registry.mjs` with `&&`, and Chromatic's
          # `--output-dir` flag gets injected by npm into the wrong
          # command — Storybook ends up building to its default
          # `storybook-static/` and Chromatic finds an empty tmp dir.
          # See package.json scripts for the split.
          buildScriptName: build-storybook:chromatic
          # Soft gate — workflow stays green even when stories diff.
          # See reference_chromatic_tuning.md for when to flip this.
          exitZeroOnChanges: true
          # Wait only for upload, not for diff results. Keeps CI fast.
          exitOnceUploaded: true
          # Enable once the first baseline is captured on main. Skips
          # re-snapshotting stories whose dependency graph hasn't changed.
          # Comment out for the first run to capture every story.
          onlyChanged: true
          # Auto-accept new snapshots on main so the baseline advances
          # on every merge. PR branches still surface diffs in the
          # Chromatic UI for review — they are NOT auto-accepted. Without
          # this, baselines never update past the initial accept and
          # every PR shows "no baseline yet" until someone clicks Accept
          # in the Chromatic UI. Standard pattern for trunk-based
          # workflows. See reference_chromatic_tuning.md.
          autoAcceptChanges: main
