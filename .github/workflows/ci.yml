name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint play tiers
        # All 37 components meet their tier as of Wave 3 (v0.20.0).
        # Required gate; new components must enter scripts/play-tiers.json.
        run: npm run lint:play-tiers

      - name: Unit tests
        run: npm run test

      - name: Build library and verify RSC "use client" banner
        # Builds dist/ and runs scripts/verify-use-client-directive.mjs
        # via the postbuild chain. Regression guard for STU-169 —
        # both dist/index.mjs and dist/index.cjs must lead with the
        # "use client"; directive so Next 16 RSC consumers can import
        # from Server Components.
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Storybook play functions (headless)
        # Required PR gate since v0.20.1. Workaround for upstream
        # https://github.com/storybookjs/storybook/issues/33347 is applied
        # via fileParallelism: false in vitest.config.ts.
        run: npm run test:storybook

      - name: Build Storybook
        run: npm run build-storybook

      - name: Start static Storybook server
        # http-server is a pinned devDependency (installed by npm ci) so this
        # step never hits the registry. The loop fails the job if the server
        # is not answering within 60 s — it used to give up silently after
        # 20 s and the a11y scan died with ECONNREFUSED (PR #73, run 1).
        run: |
          npx http-server storybook-static -p 6006 --silent &
          for i in $(seq 1 120); do
            if curl -sf http://localhost:6006/iframe.html > /dev/null; then
              echo "storybook-static reachable after $i probes"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::storybook-static never became reachable on :6006"
          exit 1

      - name: Runtime a11y scan
        run: node scripts/a11y-runtime-scan.mjs
